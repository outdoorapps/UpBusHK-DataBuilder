name: upbushk_data_builder
description: A data building utility for the UpBusHK project.
version: 0.1.0

environment:
  sdk: '^3.9.0'

isar_version: &isar_version 3.3.0-dev.3

dependencies:
  # Network
  dio: ^5.9.0
  retrofit: ^4.9.0

  # Code generation
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

  # Storage
  isar_community: *isar_version

  # Utils
  path: ^1.9.1
  collection: any
  synchronized: ^3.4.0
  get_it: ^9.0.5
  opencc: ^1.1.0

# Developer-only dependencies (for testing, linting, etc.)
dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3

  # Code generation
  build_runner: ^2.6.0
  isar_community_generator: *isar_version
  json_serializable: ^6.11.1
  freezed: ^3.2.1
  retrofit_generator: ^10.0.1

dependency_overrides:
  analyzer: 8.3.0 # For source_gen 3.0.0


# Optional: specify an entrypoint if needed (for multiple scripts)
# executables:
#   data_builder: bin/upbushk_data_builder.dart

# Prevent accidental publishing to pub.dev
publish_to: none
